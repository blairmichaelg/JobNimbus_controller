<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mobile Responsiveness Reflow */
        @media (max-width: 768px) {
            body.flex { flex-direction: column !important; overflow-y: auto !important; height: auto !important; display: block !important; }
            .w-64 { width: 100% !important; height: auto !important; border-right: none !important; border-bottom: 1px solid #374151 !important; }
            .flex-1 { flex: none !important; overflow: visible !important; }
            .grid { display: flex !important; flex-direction: column !important; gap: 1rem !important; }
            .grid-cols-2, .grid-cols-3, .grid-cols-4 { grid-template-columns: 1fr !important; }
            /* Tables */
            table { min-width: 500px !important; }
            .overflow-hidden { overflow: visible !important; }
            .bg-gray-800.overflow-hidden { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
            /* Button touch targets */
            button, a, select, input { min-height: 44px; }
            /* Fix absolute positioning on mobile if any */
            .relative { position: static !important; }
            .h-screen { height: auto !important; min-height: 100vh !important; }
        }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen flex flex-col overflow-hidden font-sans">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex flex-wrap justify-between items-center z-30">
        <div class="flex items-center space-x-3">
            <img src="/static/logo.png" alt="Wickham Roofing Logo" class="w-9 h-9 rounded shadow">
            <span class="text-white font-bold tracking-wide text-lg hidden sm:inline">Wickham Roofing</span>
        </div>

        <!-- Dashboard Switcher -->
        <div class="flex items-center space-x-2 bg-gray-950 p-1.5 rounded-lg border border-gray-800 my-1 sm:my-0 font-sans">
            <a href="/admin" class="px-3.5 py-1.5 rounded-md font-bold text-xs tracking-wider transition-all flex items-center gap-1.5 text-gray-400 hover:text-white hover:bg-gray-800">
                <span>👑</span>
                <span>Admin Board</span>
            </a>
            <a href="/accounting" class="px-3.5 py-1.5 rounded-md font-bold text-xs tracking-wider transition-all flex items-center gap-1.5 bg-green-600 text-white shadow-lg">
                <span>📊</span>
                <span>Accounting</span>
            </a>
            <a href="/api/operations/board" class="px-3.5 py-1.5 rounded-md font-bold text-xs tracking-wider transition-all flex items-center gap-1.5 text-gray-400 hover:text-white hover:bg-gray-800">
                <span>🏗️</span>
                <span>Production</span>
            </a>
            <a href="/field" class="px-3.5 py-1.5 rounded-md font-bold text-xs tracking-wider transition-all flex items-center gap-1.5 text-gray-400 hover:text-white hover:bg-gray-800">
                <span>📱</span>
                <span>Field Intake</span>
            </a>
        </div>

        <!-- Utility Links -->
        <div class="flex items-center space-x-2 font-sans">
            <a href="/admin/reps" class="text-purple-400 hover:text-white px-3 py-1.5 border border-purple-800 hover:border-purple-600 rounded text-xs font-bold transition-all">👥 Reps</a>
            <a href="/api/office/admin/triage" class="text-yellow-400 hover:text-white px-3 py-1.5 border border-yellow-800 hover:border-yellow-600 rounded text-xs font-bold transition-all">⚠️ Triage</a>
            <a href="/help" class="text-blue-400 hover:text-white px-3 py-1.5 border border-blue-800 hover:border-blue-600 rounded text-xs font-bold transition-all">❓ Help</a>
            <a href="/auth/logout" class="text-gray-400 hover:text-white px-3 py-1.5 border border-gray-800 hover:border-gray-600 rounded text-xs transition-all">Logout</a>
        </div>
    </nav>
    <div class="p-6 h-full flex flex-col flex-1 overflow-hidden">
        
        <div class="flex-1 bg-gray-900 border border-gray-700 rounded p-6 shadow-2xl flex flex-col">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <div class="text-gray-400 text-sm uppercase tracking-wider">Supplemented RCV Added</div>
                    <div id="acct-rcv" class="text-5xl text-green-500 font-bold mt-2">$0.00</div>
                </div>
                <div class="text-right">
                    <div class="text-gray-400 text-sm uppercase tracking-wider mb-2">QBO Export Queue</div>
                    <div id="acct-ready" class="text-3xl text-white font-bold mb-4">0</div>
                    <button
                        id="qbo-export-btn"
                        onclick="runQboExport()"
                        class="bg-green-700 hover:bg-green-600 text-white font-bold py-2 px-6 rounded uppercase tracking-wider transition-colors">
                        Export QBO CSV
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-auto mb-8">
                <table class="w-full text-left uppercase text-sm">
                    <thead class="sticky top-0 bg-gray-900 shadow">
                        <tr class="text-gray-500 border-b border-gray-800">
                            <th class="py-3 px-4">Job ID</th>
                            <th class="py-3 px-4">Homeowner</th>
                            <th class="py-3 px-4 text-right">Status</th>
                            <th class="px-4 py-3 text-left">ACV Check</th>
                            <th class="px-4 py-3 text-left">Supplement Check</th>
                        </tr>
                    </thead>
                    <tbody id="acct-table" class="divide-y divide-gray-800">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>

            <div class="border-b border-gray-800 pb-2 mb-4">
                <h2 class="text-xl font-bold text-green-400 uppercase tracking-widest">Commissions Ready to Pay</h2>
            </div>
            <div class="flex-1 overflow-auto">
                <table class="w-full text-left uppercase text-sm">
                    <thead class="sticky top-0 bg-gray-900 shadow">
                        <tr class="text-gray-500 border-b border-gray-800">
                            <th class="py-3 px-4">Job ID</th>
                            <th class="py-3 px-4">Homeowner</th>
                            <th class="py-3 px-4">Canvasser</th>
                            <th class="py-3 px-4">Commission</th>
                            <th class="py-3 px-4">Generated At</th>
                            <th class="py-3 px-4 text-right">Statement</th>
                            <th class="py-3 px-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="commissions-table" class="divide-y divide-gray-800">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = "{{ auth_token }}";

        async function fetchAccounting() {
            try {
                const res = await fetch('/api/office/accounting/brief', { headers: { 'X-Internal-Token': AUTH_TOKEN } });
                const data = await res.json();
                document.getElementById('acct-rcv').innerText = data.supplemented_rcv_added;
                document.getElementById('acct-ready').innerText = data.qbo_ready_count;
                
                const tbody = document.getElementById('acct-table');
                tbody.innerHTML = '';
                if (data.rows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-500 py-4">No pending checks to record.</td></tr>`;
                } else {
                    data.rows.forEach(row => {
                        const statusColor = row.status.includes('INVOICED') ? 'text-green-400' : 'text-yellow-400';
                        const acvColor = row.acv_received ? 'bg-green-700 text-green-200' : 'bg-gray-700 text-gray-400';
                        const acvText = row.acv_received ? '✓ Received' : 'Pending';
                        const suppColor = row.supplement_received ? 'bg-green-700 text-green-200' : 'bg-gray-700 text-gray-400';
                        const suppText = row.supplement_received ? '✓ Received' : 'Pending';
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-800 transition-colors">
                                <td class="py-4 px-4 text-gray-300 font-mono">
                                    <a href="/office/jobs/${row.job_id}" target="_blank" class="hover:underline"><span class="font-mono font-bold text-yellow-400">${row.invoice_id || row.job_id.substring(0,8)}</span></a>
                                    <a href="/office/jobs/${row.job_id}" target="_blank" class="mt-1 block text-green-400 hover:text-green-300 text-xs font-bold uppercase tracking-wider">View Details &rarr;</a>
                                </td>
                                <td class="py-4 px-4 text-white font-bold">${row.name}</td>
                                <td class="py-4 px-4 text-right font-bold ${statusColor}">${row.status}</td>
                                <td class="px-4 py-3">
                                    <button
                                      onclick="${row.acv_received ? '' : `showCheckForm('${row.job_id}', 'acv_received')`}"
                                      class="px-4 py-2 rounded font-bold text-sm transition-colors ${acvColor}">
                                      ${acvText}
                                    </button>
                                    ${!row.acv_received ? `
                                    <div id="checkForm-acv_received-${row.job_id}" class="hidden mt-2 space-y-2">
                                        <input type="number" step="0.01" id="checkAmount-acv_received-${row.job_id}"
                                            placeholder="Amount" class="bg-gray-800 text-white rounded p-1 text-sm w-24">
                                        <label class="text-xs text-gray-400 block">Date received</label>
                                        <input type="date" id="checkDate-acv_received-${row.job_id}"
                                            class="bg-gray-800 text-white rounded p-1 text-sm w-32">
                                        <button onclick="submitCheck('${row.job_id}', 'acv_received', ${row.acv_expected !== null ? row.acv_expected : 'null'})"
                                            class="bg-green-700 text-white text-xs px-2 py-1 rounded block">
                                            Confirm
                                        </button>
                                    </div>` : ''}
                                </td>
                                <td class="px-4 py-3">
                                    <button
                                      onclick="${row.supplement_received ? '' : `showCheckForm('${row.job_id}', 'supplement_received')`}"
                                      class="px-4 py-2 rounded font-bold text-sm transition-colors ${suppColor}">
                                      ${suppText}
                                    </button>
                                    ${!row.supplement_received ? `
                                    <div id="checkForm-supplement_received-${row.job_id}" class="hidden mt-2 space-y-2">
                                        <input type="number" step="0.01" id="checkAmount-supplement_received-${row.job_id}"
                                            placeholder="Amount" class="bg-gray-800 text-white rounded p-1 text-sm w-24">
                                        <label class="text-xs text-gray-400 block">Date received</label>
                                        <input type="date" id="checkDate-supplement_received-${row.job_id}"
                                            class="bg-gray-800 text-white rounded p-1 text-sm w-32">
                                        <button onclick="submitCheck('${row.job_id}', 'supplement_received', ${row.supp_expected !== null ? row.supp_expected : 'null'})"
                                            class="bg-green-700 text-white text-xs px-2 py-1 rounded block">
                                            Confirm
                                        </button>
                                    </div>` : ''}
                                </td>
                            </tr>
                        `;
                    });
                }

                const cres = await fetch('/api/office/accounting/commissions-ready', { headers: { 'X-Internal-Token': AUTH_TOKEN } });
                if (cres.ok) {
                    const cdata = await cres.json();
                    const ctbody = document.getElementById('commissions-table');
                    ctbody.innerHTML = '';
                    if (cdata.length === 0) {
                        ctbody.innerHTML = `<tr><td colspan="6" class="text-center text-gray-500 py-4">No commissions currently ready to pay.</td></tr>`;
                    } else {
                        cdata.forEach(row => {
                            const commAmount = (Number(row.canvasser_commission) || 0).toFixed(2);
                            let displayDate = 'N/A';
                            if (row.commission_generated_at) {
                                const ts = row.commission_generated_at.endsWith('Z') || row.commission_generated_at.includes('+')
                                    ? row.commission_generated_at
                                    : row.commission_generated_at + 'Z';
                                const parsed = new Date(ts);
                                if (!isNaN(parsed.getTime())) displayDate = parsed.toLocaleString();
                            }
                            ctbody.innerHTML += `
                                <tr class="hover:bg-gray-800 transition-colors">
                                    <td class="py-4 px-4 text-gray-300 font-mono"><a href="/office/jobs/${row.job_id}" target="_blank" class="hover:underline"><span class="font-mono font-bold text-yellow-400">${row.invoice_id || row.job_id.substring(0,8)}</span></a></td>
                                    <td class="py-4 px-4 text-white font-bold">${row.homeowner_name}</td>
                                    <td class="py-4 px-4 text-white">${row.canvasser_name || 'N/A'}</td>
                                    <td class="py-4 px-4 text-white">
                                        <div class="flex items-center gap-2">
                                            <span id="commissionAmount-${row.job_id}">$${commAmount}</span>
                                            <button onclick="showCommissionOverride('${row.job_id}')" class="text-xs text-blue-400 underline">
                                                Adjust %
                                            </button>
                                        </div>
                                        <div id="commissionOverrideForm-${row.job_id}" class="hidden mt-1 flex items-center gap-2">
                                            <input type="number" step="0.1" min="0" max="100"
                                                id="commissionPctInput-${row.job_id}"
                                                value="${row.commission_pct_override !== null ? (row.commission_pct_override * 100) : 10}"
                                                class="bg-gray-800 text-white rounded p-1 text-sm w-20">
                                            <span class="text-xs text-gray-400">%</span>
                                            <button onclick="saveCommissionOverride('${row.job_id}')"
                                                class="bg-blue-700 text-white text-xs px-2 py-1 rounded">
                                                Save
                                            </button>
                                            <button onclick="resetCommissionOverride('${row.job_id}')"
                                                class="bg-gray-600 text-white text-xs px-2 py-1 rounded">
                                                Reset
                                            </button>
                                        </div>
                                    </td>
                                    <td class="py-4 px-4 text-gray-400">${displayDate}</td>
                                    <td class="py-4 px-4 text-right">
                                        <a href="/api/office/jobs/${row.job_id}/docs/commission" target="_blank"
                                           class="bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded text-xs font-bold transition-colors">
                                           Download PDF
                                        </a>
                                    </td>
                                    <td class="py-4 px-4 text-center">
                                        <button onclick="markCommissionPaid('${row.job_id}')"
                                            class="bg-blue-700 hover:bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-bold">
                                            Mark Paid
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function markCommissionPaid(jobId) {
            if (!confirm("Confirm this commission has been paid out? This will remove it from the Commissions Ready to Pay list.")) return;
            try {
                const res = await fetch(`/api/office/accounting/jobs/${jobId}/commission/paid`, {
                    method: 'PATCH',
                    headers: { 'X-Internal-Token': AUTH_TOKEN }
                });
                if (res.ok) {
                    fetchAccounting();
                } else {
                    alert("Failed to mark commission as paid. Try again.");
                }
            } catch (e) {
                alert("Network error marking commission paid.");
            }
        }

        async function runQboExport() {
            const btn = document.getElementById('qbo-export-btn');
            btn.disabled = true;
            btn.innerText = 'Exporting...';
            try {
                const res = await fetch('/api/office/accounting/qbo-export', {
                    method: 'GET',
                    headers: { 'X-Internal-Token': AUTH_TOKEN }
                });

                if (res.status === 204) {
                    alert('No jobs pending QBO export.');
                    btn.innerText = 'Export QBO CSV';
                    btn.disabled = false;
                    return;
                }

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert('Export failed: ' + (err.detail || 'Unknown error'));
                    return;
                }
                // Trigger file download from blob
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `wickham_qbo_export_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                // Refresh accounting view to clear exported jobs from queue
                fetchAccounting();
            } catch(e) {
                alert('Network error during export.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Export QBO CSV';
            }
        }

        function showCheckForm(jobId, flag) {
            document.getElementById(`checkForm-${flag}-${jobId}`).classList.remove('hidden');
        }

        async function submitCheck(jobId, flag, expectedAmount) {
            const amount = document.getElementById(`checkAmount-${flag}-${jobId}`).value;
            const date = document.getElementById(`checkDate-${flag}-${jobId}`).value;

            if (!amount || !date) {
                alert('Please enter both the check amount and date received.');
                return;
            }

            if (expectedAmount !== null && expectedAmount > 0 && parseFloat(amount) < expectedAmount * 0.98) {
                if (!confirm(`This amount ($${amount}) is less than the expected $${expectedAmount.toFixed(2)}. This may indicate a carrier short-pay. Continue anyway?`))
                    return;
            }

            try {
                const r = await fetch(`/api/office/accounting/jobs/${jobId}/toggle-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Internal-Token': AUTH_TOKEN },
                    body: JSON.stringify({ flag: flag, amount: parseFloat(amount), date_received: date })
                });

                if (r.ok) window.location.reload();
                else alert('Error recording check.');
            } catch (err) {
                alert('Network error while recording check.');
            }
        }

        function showCommissionOverride(jobId) {
            document.getElementById(`commissionOverrideForm-${jobId}`).classList.remove('hidden');
        }

        async function saveCommissionOverride(jobId) {
            const pctInput = document.getElementById(`commissionPctInput-${jobId}`).value;
            const pct = parseFloat(pctInput);

            if (isNaN(pct) || pct < 0 || pct > 100) {
                alert('Please enter a valid percentage between 0 and 100.');
                return;
            }

            if (!confirm(`Set commission for this job to ${pct}% of revenue (overriding the default 10%)?`))
                return;

            try {
                const r = await fetch(`/api/office/accounting/jobs/${jobId}/commission-override`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Internal-Token': AUTH_TOKEN },
                    body: JSON.stringify({ commission_pct: pct / 100 })
                });

                if (r.ok) window.location.reload();
                else alert('Error saving commission override.');
            } catch (err) {
                alert('Network error while saving override.');
            }
        }

        async function resetCommissionOverride(jobId) {
            if (!confirm("Reset this job's commission back to the default 10%?"))
                return;

            try {
                const r = await fetch(`/api/office/accounting/jobs/${jobId}/commission-override`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Internal-Token': AUTH_TOKEN },
                    body: JSON.stringify({ commission_pct: null })
                });

                if (r.ok) window.location.reload();
                else alert('Error resetting commission override.');
            } catch (err) {
                alert('Network error while resetting override.');
            }
        }

        fetchAccounting();
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/api/office/ws/office`);
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'stale' || data.type === 'new_lead') fetchAccounting();
                } catch(err) { console.error('Error parsing WebSocket message:', err); }
            };
            ws.onerror = function(err) { console.warn('WebSocket error:', err); };
            ws.onclose = function() {
                console.info('WebSocket disconnected. Reconnecting in 5 seconds...');
                setTimeout(connectWebSocket, 5000);
            };
        }
        connectWebSocket();
    </script>
</body>
</html>
